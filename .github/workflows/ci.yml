name: Go DevSecOps Pipeline

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
        
jobs:
    security-and-quality:
        name: Security & Testing Gate
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout code 
            uses: actions/checkout@v6
            with: 
             fetch-depth: 0

        -   name: Set up Go
            uses: actions/setup-go@v5
            with:
                go-version: '1.27.2'
            
        - name: Verify Go toolchain
          run: go version go 1.27.2 linux/amd64

        -   name: Verify modules files
            run: go mod tidy -diff

        -   name: Security Scan (Vulncheck)
            run: |
                go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
                govulncheck ./...

        -   name: Install gosec
            run: |
                go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
                gosec_bin="$(go env GOBIN)"
                if [ -z "$gosec_bin" ]; then
                    gosec_bin="$(go env GOPATH)/bin"
                fi
                echo "$gosec_bin" >> "$GITHUB_PATH"
                test -x "$gosec_bin/gosec"

        -   name: Run gosec (SAST)
            run: gosec ./...
        
        -   name: Run all Tests
            run: go test -mod=readonly ./...

        -   name: Build all packages
            run: go build -mod=readonly ./...

        -   name: Trivy SCA (baseline)
            uses: aquasecurity/trivy-action@v0.36.0
            with:
                scan-type: 'fs'
                scan-ref: '.'
                scanners: 'vuln'
                format: 'table'
                exit-code: '0'
       
        - name: golangci-lint
          uses: golangci/golangci-lint-action@v9
          with:
            version: v2.14.0
            args: --timeout=5m


        
        - name: Detect secrets
          uses: gitleaks/gitleaks-action@v3
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITLEAKS_ENABLE_COMMENTS: "false"